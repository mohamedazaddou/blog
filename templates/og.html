<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("{{font_dir}}/inter-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("{{font_dir}}/inter-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("{{font_dir}}/inter-700.woff2") format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #08090b; color: #e7eaee;
    font-family: "Inter", "DejaVu Sans", sans-serif;
  }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }

  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(620px 520px at 86% 46%, rgba(110,242,189,.09), transparent 68%),
      linear-gradient(90deg, #08090b 62%, rgba(8,9,11,0) 78%);
  }

  .left {
    position: relative; z-index: 2;
    width: 760px; height: 630px; padding: 60px 0 56px 72px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .name { font-size: 15px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #e7eaee; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6ef2bd; box-shadow: 0 0 14px #6ef2bd; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-size: 56px; line-height: 1.08; letter-spacing: -.028em; font-weight: 700; color: #fff;
    max-width: 640px;
  }
  h1.long { font-size: 46px; }
  h1.xlong { font-size: 40px; line-height: 1.14; }
  .summary { margin-top: 24px; font-size: 21px; line-height: 1.5; color: #9aa3ad; max-width: 610px; }
  .summary.short { font-size: 23px; color: #a8b0ba; }
  .foot { display: flex; align-items: center; gap: 12px; font-size: 15px; color: #5d656f; }
  .sep { width: 4px; height: 4px; border-radius: 50%; background: #3a424c; flex: none; }
  .tag { color: #6ef2bd; }

  /* illustration : colonne droite, jamais sous le texte */
  .art {
    position: absolute; left: 770px; top: 0; width: 380px; height: 630px;
    display: flex; align-items: center; justify-content: center; z-index: 1;
  }
  .art img {
    width: 100%; height: auto; display: block;
    border: 1px solid #1d2127; border-radius: 10px; background: #08090b;
  }
  .art .mark { width: 190px; height: 190px; opacity: .85; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="art">{{figure}}</div>
  <div class="left">
    <div class="brand"><span class="name">{{site_title}}</span><span class="dot"></span></div>
    <div class="mid">
      <h1 class="{{title_class}}">{{title}}</h1>
      <p class="summary {{summary_class}}">{{summary}}</p>
    </div>
    <div class="foot">
      <span>{{date}}</span>{{read_time}}{{tag_html}}
    </div>
  </div>
</div>
</body>
</html>
