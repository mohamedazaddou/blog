<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site_title}} — {{tagline}}</title>
<meta name="description" content="{{tagline}}">
<link rel="stylesheet" href="style.css">
<link rel="alternate" type="application/rss+xml" title="{{site_title}}" href="feed.xml">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="masthead__top">
      <a class="logo" href="index.html">{{site_title}}<span class="logo__dot"></span></a>
      <nav class="masthead__nav"><a href="feed.xml">RSS</a><a href="#articles">Articles</a></nav>
    </div>
    <h1 class="masthead__title">{{tagline}}</h1>
    <p class="masthead__meta">{{count}} articles · par {{author}} · {{year}}</p>
  </div>
</header>

<main class="wrap" id="articles">
{{articles}}
</main>

<footer>
  <div class="wrap">
    <p>Textes et analyses personnelles. Chaque article cite ses sources, accessibles en bas de page.</p>
    <p class="mono">{{site_title}} · {{author}} · {{year}} · <a href="feed.xml">flux RSS</a></p>
  </div>
</footer>
</body>
</html>
