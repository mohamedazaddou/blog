<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{site_title}}</title>
<meta name="description" content="{{summary}}">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-article">
<header class="masthead masthead--slim">
  <div class="wrap">
    <div class="masthead__top">
      <a class="logo" href="index.html">{{site_title}}<span class="logo__dot"></span></a>
      <nav class="masthead__nav"><a href="index.html">Articles</a><a href="feed.xml">RSS</a>{{linkedin}}</nav>
    </div>
  </div>
</header>

<article class="article wrap">
  <h1 class="article__title">{{title}}</h1>
  <p class="article__lede">{{summary}}</p>
  <div class="prose">
{{content}}
  </div>
</article>

<footer>
  <div class="wrap">
    <p class="mono">{{site_title}} · {{author}} · {{year}} · <a href="index.html">accueil</a></p>
  </div>
</footer>
</body>
</html>
