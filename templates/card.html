<a class="card" href="{{url}}" data-src="{{source}}" data-lang="{{lang}}" data-tags="{{tag_list}}" data-search="{{search}}" data-score="{{score}}">
  <div class="card__top">
    <span class="src">{{source}}</span>
    <time>{{date}}</time>
  </div>
  <h3 class="card__title">{{title}}</h3>
  <p class="card__text">{{summary}}</p>
  <div class="card__tags">{{tags}}</div>
</a>
