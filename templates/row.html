<a class="entry" href="{{url}}">
  <div class="entry__meta">
    <time datetime="{{iso_date}}">{{date}}</time>
    <span class="entry__time">{{minutes}} min</span>
  </div>
  <h2 class="entry__title">{{title}}</h2>
  <p class="entry__summary">{{summary}}</p>
  <p class="entry__tags">{{tags}}</p>
</a>
