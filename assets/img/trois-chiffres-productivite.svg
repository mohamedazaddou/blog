<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t2 d2">
  <title id="t2">Trois mesures de productivité qui ne parlent pas de la même chose</title>
  <desc id="d2">Trois barres horizontales : plus 55 pour cent sur une tâche verte en laboratoire, plus 20 pour cent de gain perçu par les développeurs, moins 19 pour cent de temps mesuré sur 246 tickets réels.</desc>
  <defs>
    <style>
      .lab { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #e7eaee; }
      .det { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b939d; }
      .val { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
    </style>
  </defs>

  <rect width="900" height="380" fill="#08090b"/>
  <text class="sm" x="40" y="38">TROIS CHIFFRES, TROIS SITUATIONS</text>

  <!-- grille -->
  <line x1="380" y1="66" x2="380" y2="308" stroke="#2a3038" stroke-width="1"/>
  <text class="cap" x="380" y="58" text-anchor="middle">0 %</text>

  <!-- ligne 1 : +55 -->
  <text class="lab" x="260" y="98" text-anchor="end">Copilot, 2022</text>
  <text class="det" x="260" y="116" text-anchor="end">tâche verte, bornée</text>
  <rect x="380" y="80" width="286" height="34" rx="3" fill="#16302a" stroke="#2c5a49"/>
  <text class="val" x="676" y="103" fill="#6ef2bd">+55 %</text>

  <!-- ligne 2 : +20 perçu -->
  <text class="lab" x="260" y="188" text-anchor="end">perception</text>
  <text class="det" x="260" y="206" text-anchor="end">déclarée après coup</text>
  <rect x="380" y="170" width="104" height="34" rx="3" fill="#15181d" stroke="#3a424c"/>
  <text class="val" x="494" y="193" fill="#c0c7d0">+20 %</text>

  <!-- ligne 3 : -19 mesuré -->
  <text class="lab" x="260" y="278" text-anchor="end">METR, 2025</text>
  <text class="det" x="260" y="296" text-anchor="end">246 tickets réels</text>
  <rect x="281" y="260" width="99" height="34" rx="3" fill="#2a1416" stroke="#5c2a2e"/>
  <text class="val" x="330" y="283" text-anchor="middle" fill="#e08a8a">−19 %</text>

  <text class="cap" x="40" y="342">Les deux derniers chiffres viennent de la même étude, avec les mêmes développeurs :</text>
  <text class="cap" x="40" y="360">écart perception / mesure de 39 points.</text>
</svg>
