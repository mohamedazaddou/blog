<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t8 d8">
  <title id="t8">Ce que chaque protocole couvre, et ce qu'il laisse au client</title>
  <desc id="d8">Deux colonnes : à gauche les cas que MCP couvre nativement (contexte structuré, prompts versionnés, tâches asynchrones, interfaces dans la conversation, credentials centralisés) ; à droite ceux où UTCP est plus direct (API déjà documentées, protocoles natifs multiples, aucun serveur à superviser, credentials répartis dans le client).</desc>
  <defs>
    <style>
      .hd  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #e7eaee; }
      .in  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #c0c7d0; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
      .acc { fill: #6ef2bd; }
    </style>
  </defs>
  <rect width="900" height="400" fill="#08090b"/>
  <text class="sm" x="40" y="40">CE QUE VOUS AVEZ DÉJÀ DÉCIDE</text>

  <rect x="40" y="62" width="390" height="256" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="hd acc" x="60" y="92">MCP</text>
  <text class="in" x="60" y="126">contexte structuré (resources)</text>
  <text class="in" x="60" y="154">prompts versionnés</text>
  <text class="in" x="60" y="182">tâches asynchrones</text>
  <text class="in" x="60" y="210">interfaces dans la conversation</text>
  <text class="in" x="60" y="238">credentials centralisés serveur</text>
  <text class="in" x="60" y="266" fill="#8b939d">un serveur à écrire et superviser</text>
  <text class="in" x="60" y="294" fill="#8b939d">un point de défaillance unique</text>

  <rect x="470" y="62" width="390" height="256" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="hd acc" x="490" y="92">UTCP</text>
  <text class="in" x="490" y="126">API déjà propres et documentées</text>
  <text class="in" x="490" y="154">plusieurs protocoles natifs</text>
  <text class="in" x="490" y="182">aucun serveur à superviser</text>
  <text class="in" x="490" y="210">appel direct, un saut réseau en moins</text>
  <text class="in" x="490" y="238" fill="#8b939d">credentials répartis dans le client</text>
  <text class="in" x="490" y="266" fill="#8b939d">substitution de variables = injection</text>
  <text class="in" x="490" y="294" fill="#8b939d">le client gère les erreurs natives</text>

  <line x1="450" y1="62" x2="450" y2="318" stroke="#1d2127" stroke-width="1"/>

  <text class="cap" x="40" y="356">Le critère n'est pas la supériorité d'un protocole, mais ce que votre système expose déjà</text>
  <text class="cap" x="40" y="374">et qui détient les credentials.</text>
</svg>
