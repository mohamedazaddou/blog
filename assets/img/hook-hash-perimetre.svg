<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t5 d5">
  <title id="t5">Le hash d'un hook couvre sa déclaration, pas le script qu'il imprime</title>
  <desc id="d5">La déclaration du hook est hachée en sha256 et enregistrée comme trusted_hash. Le fichier de contexte imprimé par ce hook reste hors du périmètre du hash : il peut changer sans invalider l'enregistrement.</desc>
  <defs>
    <style>
      .lbl { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #e7eaee; }
      .in  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #c0c7d0; }
      .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #c0c7d0; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
      .acc { fill: #6ef2bd; }
    </style>
  </defs>
  <rect width="900" height="400" fill="#08090b"/>
  <text class="sm" x="40" y="40">CE QUE LE HASH COUVRE</text>

  <!-- déclaration -->
  <rect x="40" y="66" width="330" height="150" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="mono" x="58" y="94">hooks/codex-hooks.json</text>
  <text class="in" x="58" y="124">command, matcher, timeout</text>
  <text class="in" x="58" y="150">matcher : startup|clear|compact</text>
  <text class="in" x="58" y="176">→ imprime un fichier de contexte</text>
  <text class="cap" x="58" y="202">la déclaration seule</text>

  <!-- flèche sha256 -->
  <line x1="374" y1="141" x2="452" y2="141" stroke="#3a424c" stroke-width="1.2"/>
  <polygon points="452,141 444,137 444,145" fill="#3a424c"/>
  <text class="sm" x="380" y="130">SHA256</text>

  <!-- trusted hash -->
  <rect x="458" y="111" width="180" height="60" rx="4" fill="#0f1a16" stroke="#2c5a49"/>
  <text class="mono acc" x="548" y="137" text-anchor="middle">trusted_hash</text>
  <text class="cap" x="548" y="157" text-anchor="middle">écrit par l'installateur</text>

  <!-- cible non couverte -->
  <line x1="642" y1="141" x2="672" y2="141" stroke="#4a5360" stroke-width="1.4" stroke-dasharray="3 3"/>

  <rect x="676" y="66" width="184" height="150" rx="4" fill="#15181d" stroke="#3a424c" stroke-dasharray="4 4"/>
  <text class="in" x="694" y="94">session-start-</text>
  <text class="in" x="694" y="112">context.md</text>
  <text class="in" x="694" y="142">le texte imprimé</text>
  <text class="in" x="694" y="164">au démarrage</text>
  <text class="cap" x="694" y="196">hors du hash</text>

  <text class="in" x="40" y="262">Le hash porte sur la déclaration, pas sur la cible qu'elle désigne. Modifier le fichier</text>
  <text class="in" x="40" y="284">imprimé ne change pas le hash : le hook reste « approuvé » et son contenu a changé.</text>

  <text class="cap" x="40" y="330">D'après les enregistrements et les tests publiés dans l'issue #14370</text>
  <text class="cap" x="40" y="348">(Codex 0.162.1, Claude Code 2.1.302).</text>
</svg>
