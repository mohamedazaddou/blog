<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" role="img" aria-labelledby="t4 d4">
  <title id="t4">Le coût d'intégration se déplace du serveur vers le client</title>
  <desc id="d4">Deux barres empilées. Avec MCP, l'essentiel de la complexité est côté serveur. Avec UTCP, l'essentiel bascule côté client : authentifications multiples, validation des réponses, traduction des erreurs.</desc>
  <defs>
    <style>
      .lbl { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #e7eaee; }
      .in  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #c0c7d0; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
    </style>
  </defs>

  <rect width="900" height="326" fill="#08090b"/>

  <text class="sm" x="40" y="40">OÙ VIT LA COMPLEXITÉ</text>

  <!-- MCP -->
  <text class="lbl" x="40" y="112">MCP</text>
  <rect x="180" y="88" width="396" height="46" rx="4" fill="#0f1a16" stroke="#2c5a49"/>
  <rect x="576" y="88" width="264" height="46" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="in" x="378" y="116" text-anchor="middle">serveur : traduction, auth, supervision</text>
  <text class="in" x="708" y="116" text-anchor="middle">client : appels, sessions</text>

  <!-- UTCP -->
  <text class="lbl" x="40" y="212">UTCP</text>
  <rect x="180" y="188" width="79" height="46" rx="4" fill="#0f1a16" stroke="#2c5a49"/>
  <rect x="259" y="188" width="581" height="46" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="in" x="219" y="216" text-anchor="middle" font-size="11">manual</text>
  <text class="in" x="550" y="216" text-anchor="middle">client : auth multiples, validation, mapping d'erreurs</text>

  <text class="cap" x="40" y="290">Répartition conceptuelle, pas une mesure : le total dépend de la qualité</text>
  <text class="cap" x="40" y="306">des API exposées et du nombre d'outils.</text>
</svg>
