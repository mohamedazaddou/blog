<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t1 d1">
  <title id="t1">La chaîne installée par la mise à jour de Postman</title>
  <desc id="d1">Quatre étapes : Postman 12.33.4 au lancement, un installateur auto-existing-upgrade, un plugin avec hooks pour Codex et Claude Code, puis un hook SessionStart dont le texte est injecté dans le contexte du modèle. Trois écritures disque en découlent : config.toml de Codex, settings.json de Claude Code et le binaire postman dans .local/bin.</desc>
  <defs>
    <style>
      .lab { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #e7eaee; }
      .det { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b939d; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #c0c7d0; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
    </style>
  </defs>

  <rect width="900" height="330" fill="#08090b"/>
  <text class="sm" x="40" y="34">CE QUE L'INSTALLATEUR A ÉCRIT LE 24 OCTOBRE</text>

  <!-- étape 1 -->
  <rect x="40" y="58" width="190" height="78" rx="4" fill="#15181d" stroke="#2a3038"/>
  <text class="lab" x="56" y="86">Postman 12.33.4</text>
  <text class="det" x="56" y="106">mise à jour au lancement</text>
  <text class="det" x="56" y="122">compte connecté</text>

  <!-- étape 2 -->
  <rect x="260" y="58" width="190" height="78" rx="4" fill="#15181d" stroke="#2a3038"/>
  <text class="lab" x="276" y="86">installateur</text>
  <text class="mono" x="276" y="106">auto-existing-upgrade</text>
  <text class="det" x="276" y="122">script, pas d'invite</text>

  <!-- étape 3 -->
  <rect x="480" y="58" width="190" height="78" rx="4" fill="#15181d" stroke="#2a3038"/>
  <text class="lab" x="496" y="86">plugin + hooks</text>
  <text class="det" x="496" y="106">Codex 1.1.0</text>
  <text class="det" x="496" y="122">Claude Code 2.0.1</text>

  <!-- étape 4 -->
  <rect x="700" y="58" width="160" height="78" rx="4" fill="#16302a" stroke="#2c5a49"/>
  <text class="lab" x="716" y="86">SessionStart</text>
  <text class="det" x="716" y="106">texte injecté</text>
  <text class="det" x="716" y="122">avant tout prompt</text>

  <!-- flèches -->
  <g stroke="#3a424c" stroke-width="1.2" fill="none">
    <line x1="230" y1="97" x2="256" y2="97"/><path d="M252 93 l5 4 -5 4"/>
    <line x1="450" y1="97" x2="476" y2="97"/><path d="M472 93 l5 4 -5 4"/>
    <line x1="670" y1="97" x2="696" y2="97"/><path d="M692 93 l5 4 -5 4"/>
  </g>

  <!-- écritures disque -->
  <text class="sm" x="40" y="176">TROIS ÉCRITURES DISQUE, AUCUNE DEMANDÉE DANS L'AGENT HÔTE</text>
  <line x1="40" y1="188" x2="860" y2="188" stroke="#1d2127"/>

  <text class="mono" x="40" y="214">~/.codex/config.toml</text>
  <text class="det" x="40" y="232">marketplace git + plugin activé</text>
  <text class="det" x="40" y="248">+ trusted_hash du hook</text>

  <text class="mono" x="330" y="214">~/.claude/settings.json</text>
  <text class="det" x="330" y="232">plugin postman activé</text>
  <text class="det" x="330" y="248">installed_plugins.json</text>

  <text class="mono" x="620" y="214">~/.local/bin/postman</text>
  <text class="det" x="620" y="232">CLI 1.85.0</text>
  <text class="det" x="620" y="248">+ serveur MCP distant</text>

  <text class="cap" x="40" y="296">Le hook n'exécute pas de code dans le modèle : il ajoute du texte qui a l'autorité du système.</text>
  <text class="cap" x="40" y="314">C'est ce texte qui redéfinit le routage des tâches d'API sur le poste.</text>
</svg>
