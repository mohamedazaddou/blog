<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" role="img" aria-labelledby="t3 d3">
  <title id="t3">MCP et UTCP : avec ou sans serveur intermédiaire</title>
  <desc id="d3">À gauche, MCP : l'agent parle en JSON-RPC à un serveur MCP, qui traduit vers l'API. À droite, UTCP : l'agent lit un manuel JSON puis appelle directement l'API dans son protocole natif.</desc>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d656f"/>
    </marker>
    <marker id="a3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ef2bd"/>
    </marker>
    <style>
      .lbl { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #e7eaee; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
      .box { fill: #0d0f12; stroke: #1d2127; stroke-width: 1.2; }
      .boxA { fill: #0f1a16; stroke: #2c5a49; stroke-width: 1.2; }
      .edge { stroke: #5d656f; stroke-width: 1.4; fill: none; }
      .edgeA { stroke: #6ef2bd; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="900" height="396" fill="#08090b"/>

  <!-- gauche : MCP -->
  <text class="sm" x="60" y="42">MCP</text>
  <text class="cap" x="60" y="62">l'intermédiaire est normalisé</text>

  <rect class="box" x="60" y="88" width="320" height="50" rx="7"/>
  <text class="lbl" x="220" y="118" text-anchor="middle">agent</text>

  <rect class="boxA" x="60" y="178" width="320" height="50" rx="7"/>
  <text class="lbl" x="220" y="208" text-anchor="middle">serveur MCP</text>

  <rect class="box" x="60" y="268" width="320" height="50" rx="7"/>
  <text class="lbl" x="220" y="298" text-anchor="middle">API</text>

  <path class="edge" d="M220,138 L220,174" marker-end="url(#a3)"/>
  <path class="edge" d="M220,228 L220,264" marker-end="url(#a3)"/>
  <text class="cap" x="236" y="160">JSON-RPC</text>
  <text class="cap" x="236" y="250">traduction</text>

  <text class="cap" x="60" y="352">1 processus à écrire, déployer et superviser</text>
  <text class="cap" x="60" y="370">par fournisseur d'outils.</text>

  <!-- séparateur -->
  <line x1="450" y1="40" x2="450" y2="380" stroke="#1d2127" stroke-width="1"/>

  <!-- droite : UTCP -->
  <text class="sm" x="520" y="42">UTCP</text>
  <text class="cap" x="520" y="62">l'intermédiaire est supprimé</text>

  <rect class="box" x="520" y="88" width="320" height="50" rx="7"/>
  <text class="lbl" x="680" y="118" text-anchor="middle">agent</text>

  <rect class="box" x="520" y="178" width="150" height="50" rx="7" stroke-dasharray="4 4"/>
  <text class="lbl" x="595" y="200" text-anchor="middle">manual</text>
  <text class="cap" x="595" y="216" text-anchor="middle">JSON</text>

  <rect class="box" x="520" y="268" width="320" height="50" rx="7"/>
  <text class="lbl" x="680" y="298" text-anchor="middle">API</text>

  <path class="edge" d="M595,178 L595,142" marker-end="url(#a3)" stroke-dasharray="4 4"/>
  <path class="edgeA" d="M808,138 L808,264" marker-end="url(#a3A)"/>
  <text class="cap" x="796" y="196" text-anchor="end">appel natif</text>
  <text class="cap" x="796" y="212" text-anchor="end">HTTP, CLI, gRPC</text>

  <text class="cap" x="520" y="352">0 serveur — mais N authentifications</text>
  <text class="cap" x="520" y="370">et N formats d'erreur côté client.</text>
</svg>
