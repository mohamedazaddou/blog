<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t10 d10">
  <title id="t10">Mémoire KV par session selon la longueur du contexte, comparée à un GPU de 80 Go</title>
  <desc id="d10">Quatre longueurs de contexte, en bf16 puis en KV 4 bits : 32k coûte 4,8 Go, 128k 19,3 Go, un million de tokens 147 Go et trois millions 442 Go, pour un GPU de 80 Go.</desc>
  <defs>
    <style>
      .in  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #c0c7d0; }
      .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #e7eaee; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #5d656f; }
    </style>
  </defs>
  <rect width="900" height="420" fill="#08090b"/>
  <text class="sm" x="40" y="40">MÉMOIRE KV D'UNE SESSION — ÉCHELLE LOG</text>

  <rect x="600" y="56" width="11" height="11" rx="2" fill="#6ef2bd" opacity="0.85"/>
  <text class="cap" x="618" y="66">KV en bf16</text>
  <rect x="700" y="56" width="11" height="11" rx="2" fill="#3a424c"/>
  <text class="cap" x="718" y="66">KV en 4 bits</text>

  <line x1="200.0" y1="86" x2="200.0" y2="352" stroke="#1d2127" stroke-width="1"/>
  <text class="cap" x="200.0" y="374" text-anchor="middle">1 Go</text>
  <line x1="413.3" y1="86" x2="413.3" y2="352" stroke="#1d2127" stroke-width="1"/>
  <text class="cap" x="413.3" y="374" text-anchor="middle">10 Go</text>
  <line x1="626.7" y1="86" x2="626.7" y2="352" stroke="#1d2127" stroke-width="1"/>
  <text class="cap" x="626.7" y="374" text-anchor="middle">100 Go</text>
  <line x1="840.0" y1="86" x2="840.0" y2="352" stroke="#1d2127" stroke-width="1"/>
  <text class="cap" x="840.0" y="374" text-anchor="middle">1000 Go</text>

  <line x1="606.0" y1="84" x2="606.0" y2="360" stroke="#6ef2bd" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
  <text class="cap" x="606.0" y="82" text-anchor="middle" fill="#6ef2bd">80 Go</text>

  <text class="in" x="60" y="122">32k tokens</text>
  <rect x="200" y="108" width="145.9" height="13" rx="2" fill="#6ef2bd" opacity="0.85"/>
  <text class="mono" x="353.9" y="119">4,8 Go</text>
  <rect x="200" y="130" width="17.5" height="13" rx="2" fill="#3a424c"/>
  <text class="mono" x="225.5" y="141">1,2 Go</text>
  <text class="in" x="60" y="184">128k tokens</text>
  <rect x="200" y="170" width="274.4" height="13" rx="2" fill="#6ef2bd" opacity="0.85"/>
  <text class="mono" x="482.4" y="181">19,3 Go</text>
  <rect x="200" y="192" width="145.9" height="13" rx="2" fill="#3a424c"/>
  <text class="mono" x="353.9" y="203">4,8 Go</text>
  <text class="in" x="60" y="246">1M tokens</text>
  <rect x="200" y="232" width="462.6" height="13" rx="2" fill="#6ef2bd" opacity="0.85"/>
  <text class="mono" x="670.6" y="243">147,5 Go</text>
  <rect x="200" y="254" width="334.2" height="13" rx="2" fill="#3a424c"/>
  <text class="mono" x="542.2" y="265">36,9 Go</text>
  <text class="in" x="60" y="308">3M tokens</text>
  <rect x="200" y="294" width="564.4" height="13" rx="2" fill="#6ef2bd" opacity="0.85"/>
  <text class="mono" x="772.4" y="305">442,4 Go</text>
  <rect x="200" y="316" width="436.0" height="13" rx="2" fill="#3a424c"/>
  <text class="mono" x="644.0" y="327">110,6 Go</text>

  <text class="cap" x="60" y="400">Qwen3-8B, 36 couches, 8 têtes KV, 128 dim. Formule : 2 × couches × têtes KV × dim × octets par valeur.</text>
</svg>
