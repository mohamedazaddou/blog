<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t9 d9">
  <title id="t9">Le hook s'exécute avant le premier prompt de l'utilisateur</title>
  <desc id="d9">Quatre étapes dans l'ordre : l'événement SessionStart se déclenche à l'ouverture, le hook imprime son fichier de contexte, le premier prompt arrive, et l'agent est déjà routé selon ce texte.</desc>
  <defs>
    <style>
      .in  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #c0c7d0; }
      .hd  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #e7eaee; }
      .sm  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .12em; fill: #8b939d; }
      .cap { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5d656f; }
      .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #8b939d; }
    </style>
  </defs>
  <rect width="900" height="300" fill="#08090b"/>
  <text class="sm" x="40" y="40">ORDRE D'EXÉCUTION À L'OUVERTURE D'UNE SESSION</text>

  <rect x="40" y="86" width="180" height="76" rx="4" fill="#0f1a16" stroke="#2c5a49"/>
  <text class="hd" x="58" y="114">SessionStart</text>
  <text class="mono" x="58" y="138">startup | clear | compact</text>

  <line x1="224" y1="124" x2="244" y2="124" stroke="#3a424c" stroke-width="1.2"/>
  <polygon points="244,124 236,120 236,128" fill="#3a424c"/>

  <rect x="250" y="86" width="180" height="76" rx="4" fill="#0f1a16" stroke="#2c5a49"/>
  <text class="hd" x="268" y="114">Le hook imprime</text>
  <text class="in" x="268" y="138">son fichier de contexte</text>

  <line x1="434" y1="124" x2="454" y2="124" stroke="#3a424c" stroke-width="1.2"/>
  <polygon points="454,124 446,120 446,128" fill="#3a424c"/>

  <rect x="460" y="86" width="180" height="76" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="hd" x="478" y="114">Premier prompt</text>
  <text class="in" x="478" y="138">l'utilisateur écrit</text>

  <line x1="644" y1="124" x2="664" y2="124" stroke="#3a424c" stroke-width="1.2"/>
  <polygon points="664,124 656,120 656,128" fill="#3a424c"/>

  <rect x="670" y="86" width="190" height="76" rx="4" fill="#15181d" stroke="#3a424c"/>
  <text class="hd" x="688" y="114">Routage décidé</text>
  <text class="in" x="688" y="138">avant toute demande</text>

  <text class="in" x="40" y="212">Le texte du hook est déjà dans le contexte quand l'utilisateur écrit sa première ligne.</text>
  <text class="in" x="40" y="234">Il n'y a pas de moment où refuser : la décision de charger une compétence est prise plus tôt.</text>

  <text class="cap" x="40" y="278">Enregistrement observé dans le fil de l'issue #14370, hook SessionStart.</text>
</svg>
